<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sector Rotation Map</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
:root {
  --bg:#0d1117; --panel:#161b22; --border:#21262d;
  --text:#e6edf3; --muted:#7d8590; --blue:#58a6ff;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'SF Mono','Fira Code',Consolas,monospace;height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{background:var(--panel);border-bottom:1px solid var(--border);padding:8px 16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;flex-shrink:0}
.title{font-size:13px;font-weight:700;letter-spacing:.05em}
.subtitle{font-size:10px;color:var(--muted);margin-top:2px}
.hright{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tail-label{font-size:10px;color:var(--muted)}
.tail-btns{display:flex;gap:3px}
.tbtn{background:transparent;border:1px solid var(--border);color:var(--muted);font-size:10px;font-family:inherit;padding:3px 8px;border-radius:3px;cursor:pointer;transition:all .15s}
.tbtn:hover{border-color:var(--blue);color:var(--blue)}
.tbtn.active{background:#58a6ff22;border-color:var(--blue);color:var(--blue)}
#status{font-size:10px;color:var(--muted);display:flex;align-items:center;gap:6px}
.spin{width:10px;height:10px;border:1.5px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;display:none}
.spin.on{display:block}
@keyframes spin{to{transform:rotate(360deg)}}
.main{display:flex;flex:1;overflow:hidden}
#chart{flex:1;position:relative;overflow:hidden}
svg{display:block}
.qlabel{font-size:11px;font-weight:700;letter-spacing:.12em;fill:rgba(255,255,255,.1);text-transform:uppercase;pointer-events:none}
.sidebar{width:220px;border-left:1px solid var(--border);background:var(--panel);overflow-y:auto;flex-shrink:0}
.sb-head{font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;padding:10px 14px 8px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.sb-add{font-size:10px;color:var(--blue);cursor:pointer;border:1px solid var(--border);border-radius:3px;padding:2px 7px;background:transparent;font-family:inherit}
.sb-add:hover{background:#58a6ff22}
.srow{display:flex;align-items:center;padding:6px 14px;gap:8px;cursor:pointer;transition:background .12s;user-select:none}
.srow:hover{background:rgba(255,255,255,.04)}
.srow.hidden{opacity:.3}
.sdot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sinfo{flex:1;min-width:0}
.sticker{font-size:11px;font-weight:600}
.sname{font-size:9px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.svals{text-align:right;flex-shrink:0}
.sratio{font-size:10px}
.sphase{font-size:9px;font-weight:700;letter-spacing:.06em;margin-top:1px;text-transform:uppercase}
.LEADING{color:#3fb950}.WEAKENING{color:#d29922}.LAGGING{color:#f85149}.IMPROVING{color:#58a6ff}
.sdel{font-size:11px;color:var(--muted);padding:0 4px;opacity:0;transition:opacity .15s;cursor:pointer;flex-shrink:0}
.srow:hover .sdel{opacity:1}
.sdel:hover{color:#f85149}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:200}
.modal-bg.open{display:flex}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:20px;width:300px}
.modal h3{font-size:13px;margin-bottom:12px}
.modal input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--text);font-family:inherit;font-size:12px;padding:7px 10px;outline:none;margin-bottom:10px}
.modal input:focus{border-color:var(--blue)}
.modal-btns{display:flex;gap:8px;justify-content:flex-end}
.mbtn{background:transparent;border:1px solid var(--border);border-radius:4px;color:var(--text);font-family:inherit;font-size:11px;padding:5px 14px;cursor:pointer;transition:all .15s}
.mbtn.primary{background:var(--blue);border-color:var(--blue);color:#000;font-weight:600}
.mbtn:hover:not(.primary){border-color:var(--blue);color:var(--blue)}
#tip{position:fixed;background:#1c2128;border:1px solid var(--border);border-radius:6px;padding:10px 13px;font-size:11px;pointer-events:none;opacity:0;transition:opacity .1s;z-index:100;min-width:160px;box-shadow:0 4px 20px rgba(0,0,0,.5)}
#tip.on{opacity:1}
#tip .tt{font-size:13px;font-weight:700;margin-bottom:5px}
#tip .tr{display:flex;justify-content:space-between;gap:16px;color:var(--muted);margin-top:3px}
#tip .tr span:last-child{color:var(--text);font-weight:500}
.bmark-label{font-size:10px;color:var(--muted)}
.bmark-select{background:var(--bg);border:1px solid var(--border);border-radius:3px;color:var(--text);font-family:inherit;font-size:10px;padding:3px 8px;outline:none;cursor:pointer}
.bmark-select:focus{border-color:var(--blue)}
</style>
</head>
<body>
<header>
  <div>
    <div class="title">SECTOR ROTATION MAP</div>
    <div class="subtitle" id="subtitle">11 GICS Sector ETFs vs SPY &nbsp;&middot;&nbsp; Weekly bars</div>
  </div>
  <div class="hright">
    <div style="display:flex;align-items:center;gap:6px">
      <span class="bmark-label">BENCHMARK</span>
      <select class="bmark-select" id="bench-select" onchange="changeBenchmark(this.value)">
        <option value="SPY">SPY — S&amp;P 500</option>
        <option value="QQQ">QQQ — Nasdaq 100</option>
        <option value="DIA">DIA — Dow Jones</option>
        <option value="IWM">IWM — Russell 2000</option>
        <option value="VTI">VTI — Total Market</option>
      </select>
    </div>
    <div style="display:flex;align-items:center;gap:6px">
      <span class="tail-label">TAIL</span>
      <div class="tail-btns">
        <button class="tbtn" data-w="1">1W</button>
        <button class="tbtn" data-w="4">4W</button>
        <button class="tbtn active" data-w="8">8W</button>
        <button class="tbtn" data-w="12">12W</button>
        <button class="tbtn" data-w="16">16W</button>
        <button class="tbtn" data-w="26">26W</button>
      </div>
    </div>
    <div id="status"><div class="spin" id="spin"></div><span id="stxt">Loading...</span></div>
  </div>
</header>

<div class="main">
  <div id="chart"></div>
  <aside class="sidebar">
    <div class="sb-head">
      <span>Sectors</span>
      <button class="sb-add" onclick="openModal()">+ Add</button>
    </div>
    <div id="slist"></div>
  </aside>
</div>

<div class="modal-bg" id="modal">
  <div class="modal">
    <h3>Add Sector / ETF</h3>
    <input id="modal-ticker" placeholder="Ticker (e.g. XLC, GLD, QQQ)" maxlength="10"
           onkeydown="if(event.key==='Enter')addFromModal()">
    <input id="modal-name" placeholder="Label (e.g. Communication Svcs)" maxlength="30"
           onkeydown="if(event.key==='Enter')addFromModal()">
    <div class="modal-btns">
      <button class="mbtn" onclick="closeModal()">Cancel</button>
      <button class="mbtn primary" onclick="addFromModal()">Add</button>
    </div>
  </div>
</div>

<div id="tip"></div>

<script>
// ── CONFIG ──────────────────────────────────────────────
let BENCHMARK = "SPY";

const DEFAULT_SECTORS = [
  {ticker:"XLK",  name:"Technology",        color:"#58a6ff"},
  {ticker:"XLF",  name:"Financials",         color:"#3fb950"},
  {ticker:"XLV",  name:"Health Care",        color:"#a5d6ff"},
  {ticker:"XLE",  name:"Energy",             color:"#d29922"},
  {ticker:"XLY",  name:"Consumer Discret.",  color:"#f0883e"},
  {ticker:"XLP",  name:"Consumer Staples",   color:"#bc8cff"},
  {ticker:"XLI",  name:"Industrials",        color:"#79c0ff"},
  {ticker:"XLB",  name:"Materials",          color:"#56d364"},
  {ticker:"XLU",  name:"Utilities",          color:"#ffa657"},
  {ticker:"XLRE", name:"Real Estate",        color:"#ff7b72"},
  {ticker:"XLC",  name:"Comm. Services",     color:"#e3b341"},
];

const EXTRA_COLORS = [
  "#c9d1d9","#8b949e","#b1bac4","#cae8ff","#7ee787",
  "#ffab70","#d2a8ff","#f0f6fc","#6e7681","#79c0ff"
];

// ── STATE ────────────────────────────────────────────────
let tailWeeks = 8;
let hiddenSet = new Set();
let sectors   = JSON.parse(JSON.stringify(DEFAULT_SECTORS));
let rrgData   = {};
let svgEl     = null;
let benchCloses = [];

// ── FETCH ────────────────────────────────────────────────
async function fetchWeekly(ticker) {
  const end   = Math.floor(Date.now() / 1000);
  const start = end - 3 * 365 * 24 * 3600;
  const yahooUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${ticker}?interval=1wk&period1=${start}&period2=${end}`;

  // CORS proxies tried in order — first one that works is used
  const proxies = [
    u => `https://corsproxy.io/?${encodeURIComponent(u)}`,
    u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
    u => `https://thingproxy.freeboard.io/fetch/${u}`,
  ];

  let lastErr;
  for (const proxy of proxies) {
    try {
      const res = await fetch(proxy(yahooUrl));
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const j = await res.json();
      const result = j?.chart?.result?.[0];
      if (!result) throw new Error("No chart data");
      const closes = result.indicators.quote[0].close;
      const out = closes.filter(v => v != null);
      if (out.length < 5) throw new Error("Too few bars");
      return out;
    } catch(e) { lastErr = e; await sleep(200); }
  }
  throw new Error(`All proxies failed for ${ticker}: ${lastErr?.message}`);
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

function setStatus(msg, loading=false) {
  document.getElementById("stxt").textContent = msg;
  document.getElementById("spin").classList.toggle("on", loading);
}

// ── RRG MATH ─────────────────────────────────────────────
const ema = (arr, p) => {
  const k = 2/(p+1); let v = arr[0];
  return arr.map((x,i) => { if(!i) return v; v=x*k+v*(1-k); return v; });
};
const sma = (arr, p) => arr.map((_,i) =>
  i<p-1 ? null : arr.slice(i-p+1,i+1).reduce((a,b)=>a+b,0)/p
);

function computeRRG(sc, bc) {
  const n  = Math.min(sc.length, bc.length);
  const s  = sc.slice(-n), b = bc.slice(-n);
  const rs = s.map((v,i) => (v/b[i])*100);
  const p  = 10;
  const sm = ema(rs, p);
  const mn = sma(sm, p);
  const ratio = sm.map((v,i) => mn[i]==null ? null : (v/mn[i])*100);
  const rf    = ratio.map(v => v==null ? 100 : v);
  const ms2   = ema(rf, p);
  const mn2   = sma(ms2, p);
  const mom   = ms2.map((v,i) => mn2[i]==null ? null : (v/mn2[i])*100);
  const pts   = [];
  for(let i=0;i<ratio.length;i++)
    if(ratio[i]!=null && mom[i]!=null) pts.push({ratio:ratio[i], momentum:mom[i]});
  return pts;
}

function phase(r, m) {
  if(r>=100&&m>=100) return "LEADING";
  if(r>=100&&m< 100) return "WEAKENING";
  if(r< 100&&m< 100) return "LAGGING";
  return "IMPROVING";
}

// ── LOAD ALL ─────────────────────────────────────────────
async function changeBenchmark(val) {
  BENCHMARK = val;
  rrgData = {};
  benchCloses = [];
  setStatus("Reloading...", true);
  await loadAll(sectors.map(s => s.ticker));
  renderChart();
  renderSidebar();
}

async function loadAll(tickers) {
  setStatus(`Fetching ${BENCHMARK}...`, true);
  try { benchCloses = await fetchWeekly(BENCHMARK); }
  catch(e) { setStatus("Failed to load benchmark"); return; }
  await sleep(120);

  for (let i=0; i<tickers.length; i++) {
    const t = tickers[i];
    setStatus(`Fetching ${t}... (${i+1}/${tickers.length})`, true);
    try {
      const c = await fetchWeekly(t);
      if (c.length > 20) rrgData[t] = computeRRG(c, benchCloses);
    } catch(e) { console.warn(`${t}: ${e.message}`); }
    if (i < tickers.length-1) await sleep(120);
  }

  const d = new Date();
  document.getElementById("subtitle").textContent =
    `vs ${BENCHMARK} · Weekly bars · Updated ${d.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})}`;
  setStatus("Ready");
}

async function loadOne(ticker) {
  setStatus(`Fetching ${ticker}...`, true);
  const c = await fetchWeekly(ticker);
  if (c.length > 20) rrgData[ticker] = computeRRG(c, benchCloses);
  setStatus("Ready");
}

// ── TAIL ─────────────────────────────────────────────────
function tailPoints(ticker) {
  const pts = rrgData[ticker];
  if (!pts?.length) return [];
  return pts.slice(-tailWeeks);
}

// ── SIDEBAR ──────────────────────────────────────────────
function renderSidebar() {
  const list = document.getElementById("slist");
  list.innerHTML = "";
  sectors.forEach(s => {
    const pts  = tailPoints(s.ticker);
    const last = pts[pts.length-1] || {};
    const ph   = last.ratio!=null ? phase(last.ratio, last.momentum) : "–";
    const row  = document.createElement("div");
    row.className = "srow" + (hiddenSet.has(s.ticker) ? " hidden" : "");
    row.innerHTML = `
      <div class="sdot" style="background:${s.color}"></div>
      <div class="sinfo">
        <div class="sticker">${s.ticker}</div>
        <div class="sname">${s.name}</div>
      </div>
      <div class="svals">
        <div class="sratio" style="color:${s.color}">
          ${last.ratio?last.ratio.toFixed(2):"–"} / ${last.momentum?last.momentum.toFixed(2):"–"}
        </div>
        <div class="sphase ${ph}">${ph}</div>
      </div>
      <div class="sdel" title="Remove" onclick="removeSector('${s.ticker}',event)">x</div>`;
    row.addEventListener("click", e => {
      if(e.target.classList.contains("sdel")) return;
      toggleSector(s.ticker);
    });
    list.appendChild(row);
  });
}

function toggleSector(ticker) {
  hiddenSet.has(ticker) ? hiddenSet.delete(ticker) : hiddenSet.add(ticker);
  renderChart(); renderSidebar();
}

function removeSector(ticker, e) {
  e.stopPropagation();
  sectors = sectors.filter(s => s.ticker !== ticker);
  hiddenSet.delete(ticker);
  delete rrgData[ticker];
  renderChart(); renderSidebar();
}

// ── MODAL ────────────────────────────────────────────────
function openModal() {
  document.getElementById("modal").classList.add("open");
  document.getElementById("modal-ticker").value = "";
  document.getElementById("modal-name").value = "";
  setTimeout(() => document.getElementById("modal-ticker").focus(), 50);
}
function closeModal() { document.getElementById("modal").classList.remove("open"); }

async function addFromModal() {
  const ticker = document.getElementById("modal-ticker").value.trim().toUpperCase();
  const name   = document.getElementById("modal-name").value.trim() || ticker;
  if (!ticker) return;
  if (sectors.find(s => s.ticker === ticker)) { closeModal(); return; }
  const color = EXTRA_COLORS[sectors.length % EXTRA_COLORS.length];
  sectors.push({ticker, name, color});
  closeModal();
  try {
    await loadOne(ticker);
  } catch(e) {
    setStatus(`Failed: ${ticker}`);
  }
  renderChart(); renderSidebar();
}

document.getElementById("modal").addEventListener("click", e => {
  if(e.target === document.getElementById("modal")) closeModal();
});

// ── CHART ────────────────────────────────────────────────
function renderChart() {
  const container = document.getElementById("chart");
  if (svgEl) svgEl.remove();
  const W = container.clientWidth, H = container.clientHeight;
  const m = {top:28,right:28,bottom:44,left:50};
  const iW = W-m.left-m.right, iH = H-m.top-m.bottom;

  let allR=[], allM=[];
  sectors.forEach(s => {
    if(hiddenSet.has(s.ticker)) return;
    tailPoints(s.ticker).forEach(p => { allR.push(p.ratio); allM.push(p.momentum); });
  });

  const rPad = allR.length ? Math.max(100-Math.min(...allR), Math.max(...allR)-100)*1.2 : 2;
  const mPad = allM.length ? Math.max(100-Math.min(...allM), Math.max(...allM)-100)*1.2 : 2;
  const rMin=100-Math.max(rPad,.8), rMax=100+Math.max(rPad,.8);
  const mMin=100-Math.max(mPad,.8), mMax=100+Math.max(mPad,.8);

  const xSc = d3.scaleLinear().domain([rMin,rMax]).range([0,iW]);
  const ySc = d3.scaleLinear().domain([mMin,mMax]).range([iH,0]);
  const x100=xSc(100), y100=ySc(100);

  svgEl = d3.select(container).append("svg").attr("width",W).attr("height",H);
  const g = svgEl.append("g").attr("transform",`translate(${m.left},${m.top})`);

  // Quadrant fills + labels
  [
    {x:0,   y:0,   w:x100,   h:y100,   fill:"rgba(26,42,26,.5)",  label:"IMPROVING", lx:x100*.22,         ly:16},
    {x:x100,y:0,   w:iW-x100,h:y100,   fill:"rgba(20,40,26,.5)",  label:"LEADING",   lx:x100+(iW-x100)*.5,ly:16},
    {x:0,   y:y100,w:x100,   h:iH-y100,fill:"rgba(42,26,26,.5)",  label:"LAGGING",   lx:x100*.22,         ly:y100+(iH-y100)*.9},
    {x:x100,y:y100,w:iW-x100,h:iH-y100,fill:"rgba(42,34,16,.5)", label:"WEAKENING", lx:x100+(iW-x100)*.5,ly:y100+(iH-y100)*.9},
  ].forEach(q => {
    g.append("rect").attr("x",q.x).attr("y",q.y).attr("width",q.w).attr("height",q.h).attr("fill",q.fill);
    g.append("text").attr("x",q.lx).attr("y",q.ly).attr("text-anchor","middle").attr("class","qlabel").text(q.label);
  });

  // Grid lines
  xSc.ticks(8).forEach(v => g.append("line").attr("x1",xSc(v)).attr("x2",xSc(v)).attr("y1",0).attr("y2",iH)
    .attr("stroke","rgba(255,255,255,.04)").attr("stroke-width",1));
  ySc.ticks(8).forEach(v => g.append("line").attr("x1",0).attr("x2",iW).attr("y1",ySc(v)).attr("y2",ySc(v))
    .attr("stroke","rgba(255,255,255,.04)").attr("stroke-width",1));

  // Centre dashed
  [[x100,x100,0,iH],[0,iW,y100,y100]].forEach(([x1,x2,y1,y2]) =>
    g.append("line").attr("x1",x1).attr("x2",x2).attr("y1",y1).attr("y2",y2)
      .attr("stroke","rgba(255,255,255,.22)").attr("stroke-width",1).attr("stroke-dasharray","4,4"));

  // Axes
  const axFmt = ax => {
    ax.select(".domain").remove();
    ax.selectAll("line").attr("stroke","var(--border)");
    ax.selectAll("text").attr("fill","var(--muted)").attr("font-size","9px").attr("font-family","inherit");
  };
  g.append("g").attr("transform",`translate(0,${iH})`)
    .call(d3.axisBottom(xSc).ticks(8).tickFormat(d3.format(".1f"))).call(axFmt);
  g.append("g").call(d3.axisLeft(ySc).ticks(8).tickFormat(d3.format(".1f"))).call(axFmt);
  g.append("text").attr("x",iW/2).attr("y",iH+36).attr("text-anchor","middle")
    .attr("fill","var(--muted)").attr("font-size","10px").attr("font-family","inherit").text("RS-Ratio");
  g.append("text").attr("transform","rotate(-90)").attr("x",-iH/2).attr("y",-38)
    .attr("text-anchor","middle").attr("fill","var(--muted)").attr("font-size","10px").attr("font-family","inherit").text("RS-Momentum");

  // Draw sectors
  const tip = document.getElementById("tip");
  sectors.forEach(s => {
    if(hiddenSet.has(s.ticker)) return;
    const pts = tailPoints(s.ticker);
    if(!pts.length) return;
    const n = pts.length;

    // Fading tail segments
    for(let i=1;i<n;i++) {
      const a = 0.12 + 0.72*(i/n);
      g.append("line")
        .attr("x1",xSc(pts[i-1].ratio)).attr("y1",ySc(pts[i-1].momentum))
        .attr("x2",xSc(pts[i].ratio))  .attr("y2",ySc(pts[i].momentum))
        .attr("stroke",s.color).attr("stroke-width",1.8)
        .attr("stroke-opacity",a).attr("stroke-linecap","round");
    }

    // Intermediate dots (smaller for weekly — 1 dot = 1 week, no clutter)
    pts.slice(0,-1).forEach((p,i) => {
      g.append("circle")
        .attr("cx",xSc(p.ratio)).attr("cy",ySc(p.momentum))
        .attr("r",2.8).attr("fill",s.color)
        .attr("fill-opacity",0.18+0.55*(i/n)).attr("stroke","none");
    });

    // Head dot
    const last = pts[n-1];
    const hg = g.append("g")
      .attr("transform",`translate(${xSc(last.ratio)},${ySc(last.momentum)})`)
      .style("cursor","pointer");
    hg.append("circle").attr("r",9).attr("fill",s.color).attr("fill-opacity",.15)
      .attr("stroke",s.color).attr("stroke-width",1.5);
    hg.append("circle").attr("r",5).attr("fill",s.color).attr("fill-opacity",.9);
    hg.append("text").attr("dy",-13).attr("text-anchor","middle")
      .attr("fill",s.color).attr("font-size","9px").attr("font-family","inherit")
      .attr("font-weight","700").text(s.ticker);

    hg.on("mousemove", ev => {
      const ph = phase(last.ratio, last.momentum);
      tip.innerHTML=`
        <div class="tt" style="color:${s.color}">${s.ticker}</div>
        <div style="font-size:9px;color:var(--muted);margin-bottom:5px">${s.name}</div>
        <div class="tr"><span>RS-Ratio</span><span>${last.ratio.toFixed(3)}</span></div>
        <div class="tr"><span>Momentum</span><span>${last.momentum.toFixed(3)}</span></div>
        <div class="tr"><span>Phase</span><span class="${ph}">${ph}</span></div>
        <div class="tr"><span>Tail</span><span>${n} weeks</span></div>`;
      tip.classList.add("on");
      tip.style.left=(ev.clientX+14)+"px";
      tip.style.top =(ev.clientY-10)+"px";
    }).on("mouseleave",()=>tip.classList.remove("on"));
  });
}

// ── TAIL BUTTONS ─────────────────────────────────────────
document.querySelectorAll(".tbtn").forEach(btn => {
  btn.addEventListener("click", () => {
    tailWeeks = +btn.dataset.w;
    document.querySelectorAll(".tbtn").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    renderChart(); renderSidebar();
  });
});

// ── RESIZE ───────────────────────────────────────────────
let rt;
window.addEventListener("resize",()=>{clearTimeout(rt);rt=setTimeout(renderChart,100);});

// ── INIT ─────────────────────────────────────────────────
(async () => {
  await loadAll(sectors.map(s=>s.ticker));
  renderChart();
  renderSidebar();
})();
</script>
</body>
</html>
